<svg xmlns="http://www.w3.org/2000/svg" width="784" height="564" viewBox="0 0 784 564">
<title>Regra do quociente: q = g/u lida como g = q·u</title>
<rect x="0" y="0" width="784" height="564" fill="#0F1115"/>
<g id="pr-boxes">
<g id="antiga">
